version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: linkhub_postgres
    environment:
      POSTGRES_DB: linkhub
      POSTGRES_USER: linkhub_user
      POSTGRES_PASSWORD: linkhub_secret_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: linkhub_backend
    environment:
      FLASK_ENV: production
      DATABASE_URL: postgresql://linkhub_user:linkhub_secret_password@postgres:5432/linkhub
      JWT_SECRET_KEY: super-jwt-secret-key-linkhub
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: linkhub_frontend
    ports:
      - "5174:5174"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
