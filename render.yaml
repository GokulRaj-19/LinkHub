# Render Blueprint Specification for LinkHub (team3-LMS)
# https://render.com/docs/blueprint-spec

version: "1"

services:
  # ----------------------------------------------------------------------
  # 1. Flask REST API Backend Web Service
  # ----------------------------------------------------------------------
  - type: web
    name: team3-lms-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python seed.py && gunicorn run:app
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: team3-lms-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"
      - key: JWT_COOKIE_SECURE
        value: "True"

  # ----------------------------------------------------------------------
  # 2. React Vite Frontend Static Site
  # ----------------------------------------------------------------------
  - type: web
    name: team3-lms-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: team3-lms-backend
          envVarKey: RENDER_EXTERNAL_URL

databases:
  # ----------------------------------------------------------------------
  # 3. Managed PostgreSQL Database
  # ----------------------------------------------------------------------
  - name: team3-lms-db
    plan: free
    databaseName: linkhub
    user: linkhub_user
